<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <title>Стих</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #333;
      padding: 30px;
      max-width: 800px;
      margin: auto;
    }
    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #1a5f7a;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 1em;
      padding: 0;
    }
    .back:hover {
      text-decoration: underline;
    }
    .title {
      font-size: 1.8em;
      color: #1a5f7a;
      margin-bottom: 10px;
    }
    .controls {
      margin-bottom: 20px;
    }
    .size-btn {
      background: #1a5f7a;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2em;
      cursor: pointer;
      margin: 0 5px;
      transition: background 0.2s;
    }
    .size-btn:hover {
      background: #154a5f;
    }
    .content {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 1.1em;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: font-size 0.2s ease;
    }
    .error {
      color: red;
      text-align: center;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <!-- Кнопка "Назад" (не ссылка, а кнопка, вызывающая history.back()) -->
  <button id="back-btn" class="back">← Назад</button>

  <div id="poem-container">
    <p>Загрузка стиха...</p>
  </div>

<script>
  // Регистрация Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('SW зарегистрирован:', reg.scope))
        .catch(err => console.error('Ошибка регистрации SW:', err));
    });
  }
</script>


  <script>
    // Получаем ID стиха из URL
    const urlParams = new URLSearchParams(window.location.search);
    const poemId = parseInt(urlParams.get('id'));

    // Проверка корректности ID
    if (isNaN(poemId)) {
      document.getElementById('poem-container').innerHTML =
        '<p class="error">Неверный ID стиха.</p>';
      console.error('Неверный ID:', urlParams.get('id'));
      throw new Error('Invalid poem ID');
    }

    // Кнопка "Назад" — возвращаемся в истории браузера
    document.getElementById('back-btn').addEventListener('click', (e) => {
      e.preventDefault();
      history.back(); // ← Возвращает ровно туда, откуда пришли
    });

    // Ключ для сохранения размера шрифта (индивидуально для каждого стиха)
    const fontSizeKey = `fontSize_${poemId}`;
    let currentSize = parseFloat(localStorage.getItem(fontSizeKey)) || 1.1;

    // Загружаем список стихов
    fetch('poems.json')
      .then(res => {
        if (!res.ok) {
          throw new Error(`Ошибка загрузки: ${res.status} ${res.statusText}`);
        }
        return res.json();
      })
      .then(poems => {
        // Ищем стих по ID
        const poem = poems.find(p => p.id === poemId);

        if (!poem) {
          document.getElementById('poem-container').innerHTML =
            '<p class="error">Стих не найден.</p>';
          return;
        }

        // Очищаем контейнер
        const container = document.getElementById('poem-container');
        container.innerHTML = '';

        // Заголовок
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = poem.title;

        // Панель управления размером шрифта
        const controls = document.createElement('div');
        controls.className = 'controls';

        const btnMinus = document.createElement('button');
        btnMinus.className = 'size-btn';
        btnMinus.textContent = '−';
        btnMinus.title = 'Уменьшить размер текста';

        const btnPlus = document.createElement('button');
        btnPlus.className = 'size-btn';
        btnPlus.textContent = '+';
        btnPlus.title = 'Увеличить размер текста';

        controls.appendChild(btnMinus);
        controls.appendChild(btnPlus);

        // Содержимое стиха
        const content = document.createElement('div');
        content.className = 'content';
        content.textContent = poem.content.replace(/\//g, '\n'); // Заменяем / на перенос
        content.style.fontSize = `${currentSize}em`;

        // Обработчики изменения размера
        btnMinus.addEventListener('click', () => {
          if (currentSize > 0.7) {
            currentSize -= 0.1;
            content.style.fontSize = `${currentSize}em`;
            localStorage.setItem(fontSizeKey, currentSize.toFixed(1));
          }
        });

        btnPlus.addEventListener('click', () => {
          if (currentSize < 2.0) {
            currentSize += 0.1;
            content.style.fontSize = `${currentSize}em`;
            localStorage.setItem(fontSizeKey, currentSize.toFixed(1));
          }
        });

        // Собираем страницу
        container.appendChild(title);
        container.appendChild(controls);
        container.appendChild(content);
      })
      .catch(err => {
        console.error('Ошибка:', err);
        document.getElementById('poem-container').innerHTML = `
          <p class="error">Ошибка загрузки стиха: ${err.message}</p>
        `;
      });
  </script>
</body>
</html>
