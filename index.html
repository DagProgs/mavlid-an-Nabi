    <style>
        body { 
            margin: 0; padding: 0; background: #fff; 
            font-family: sans-serif; color: white;
            overflow-x: hidden;
        }
        
        /* Баннеры */
        .full-width-banner { width: 100%; height: auto; display: block; }

        /* ФИКСИРОВАННЫЙ HEADER (Блок кнопок) */
        .controls-container {
            position: sticky; /* Прилипает к верху */
            top: 0;           /* Точка фиксации */
            z-index: 50;      /* Поверх сетки */
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            gap: 15px;
            
            backdrop-filter: blur(10px);        /* Эффект размытия фона под кнопками */
        }

        /* Когда есть избранное, этот класс активирует липкое меню */
        .controls-container.active {
            max-height: 100px;
            opacity: 1;
            padding: 15px 0;
        }

        .filter-btn {
            padding: 10px 22px;
            border-radius: 25px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .filter-btn.selected { background: #ff4757; border-color: #ff4757; }

        /* Сетка превью */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; padding: 15px;
        }

        .grid-wrapper { position: relative; }

        .grid-item {
            aspect-ratio: 1 / 1; object-fit: cover; width: 100%;
            cursor: pointer; border-radius: 15px; 
            transition: transform 0.2s; background: #f1f1f1;
            box-sizing: border-box; border: 3px solid transparent;
        }

        /* Кнопка сердечка на фото */
        .fav-btn {
            position: absolute; top: 8px; right: 8px;
            border: none;
            color: #fff; font-size: 18px; cursor: pointer;
            border-radius: 50%; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; z-index: 5;
        }

        .fav-btn.in-fav { color: #fff; background: green; }

        /* Анимация мигания при возврате */
        @keyframes blink-highlight {
            0% { border-color: #fff; transform: scale(1.05); box-shadow: 0 0 20px #fff; }
            50% { border-color: transparent; transform: scale(1); box-shadow: none; }
            100% { border-color: #fff; transform: scale(1.05); box-shadow: 0 0 20px #fff; }
        }
        .highlight { animation: blink-highlight 1s ease-in-out 3; z-index: 10; }

        /* Полноэкранный режим просмотра */
        .full-view { display: none; width: 100%; padding-bottom: 50px; }
        .full-view img {
            width: 95%; margin: 15px auto; height: auto;
            display: block; border-radius: 20px; 
        }

        /* Умная кнопка "Назад" (выезжает при скролле вверх) */
        .back-btn {
            position: fixed; top: 15px; right: 15px;
            padding: 12px 24px; background: rgba(0, 0, 0, 0.9);
            color: white; border: 2px solid #fff; border-radius: 30px; 
            cursor: pointer; z-index: 100; font-weight: bold;
            opacity: 0; transform: translateY(-80px);
            transition: all 0.4s ease;
            pointer-events: none;
        }
        .back-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        /*iphone*/
    .iphoneinstall h3 {
        color: black;
        padding-left: 15px;
    }

    .iphoneinstall {
      display: none;
      position: fixed; 
      top: 0; 
      left: 0;

    }

    .iphoneinstall p {
      display: flex;

      padding: 10px;
    }

      margin: 10px;

<body>

    <button id="backBtn" class="back-btn">← НАЗАД</button>

    <div id="mainPage">
        <!-- 1. Первый баннер (не кликабельный) -->
        <img src="assets/img/1.webp" class="full-width-banner" alt="Начало">
        
        <!-- 2. ФИКСИРОВАННЫЙ БЛОК УПРАВЛЕНИЯ -->
        <div id="controls" class="controls-container">
            <button id="showAll" class="filter-btn selected">Показать все</button>
            <button id="showFav" class="filter-btn">Только избранное</button>
        </div>
        
        <!-- 3. Сетка (картинки со 2 по 41) -->
        <div id="grid" class="grid-container"></div>
        
        <!-- 4. Последний баннер (не кликабельный) -->
        <img src="assets/img/42.webp" class="full-width-banner" alt="Конец">
    </div>

    <!-- Режим просмотра всей ленты -->
    <div id="full" class="full-view"></div>

    <script>
        const grid = document.getElementById('grid');
        const full = document.getElementById('full');
        const backBtn = document.getElementById('backBtn');
        const mainPage = document.getElementById('mainPage');
        const controls = document.getElementById('controls');
        
        const btnAll = document.getElementById('showAll');
        const btnFav = document.getElementById('showFav');
        
        const totalImages = 42; 
        let lastScrollPos = 0; 
        let lastClickedIndex = null; 
        let lastScrollTop = 0;
        let isFullViewActive = false;
        let isFilterMode = false;

        // Данные избранного из LocalStorage
        let favorites = JSON.parse(localStorage.getItem('gallery_favorites_v2')) || [];

        function checkControlsVisibility() {
            if (favorites.length > 0) {
                controls.classList.add('active');
            } else {
                controls.classList.remove('active');
                applyFilter(false); 
            }
        }

        // Инициализация галереи
        function init() {
            for (let i = 1; i <= totalImages; i++) {
                const path = `assets/img/${i}.webp`;

                // Наполнение сетки (пропускаем 1 и 42)
                if (i > 1 && i < totalImages) {
                    const wrap = document.createElement('div');
                    wrap.className = 'grid-wrapper';
                    wrap.dataset.id = i;

                    const img = document.createElement('img');
                    img.src = path;
                    img.className = 'grid-item';
                    img.id = `thumb-${i}`;
                    img.loading = 'lazy';
                    img.onclick = () => openFullView(i);

                    const heart = document.createElement('button');
                    heart.className = `fav-btn ${favorites.includes(i) ? 'in-fav' : ''}`;
                    heart.innerHTML = '📌';
                    heart.onclick = (e) => {
                        e.stopPropagation();
                        toggleFavorite(i, heart);
                    };

                    wrap.appendChild(img);
                    wrap.appendChild(heart);
                    grid.appendChild(wrap);
                }

                // Наполнение режима просмотра (все 42 изображения)
                const fImg = document.createElement('img');
                fImg.src = path;
                fImg.id = `full-${i}`;
                fImg.loading = 'lazy';
                full.appendChild(fImg);
            }
            checkControlsVisibility();
        }

        function toggleFavorite(id, btn) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(item => item !== id);
                btn.classList.remove('in-fav');
            } else {
                favorites.push(id);
                btn.classList.add('in-fav');
            }
            localStorage.setItem('gallery_favorites_v2', JSON.stringify(favorites));
            checkControlsVisibility();
            if (isFilterMode) applyFilter(true);
        }

        function applyFilter(onlyFavs) {
            isFilterMode = onlyFavs;
            const items = document.querySelectorAll('.grid-wrapper');
            
            items.forEach(item => {
                const id = parseInt(item.dataset.id);
                item.style.display = (onlyFavs && !favorites.includes(id)) ? 'none' : 'block';
            });

            btnAll.classList.toggle('selected', !onlyFavs);
            btnFav.classList.toggle('selected', onlyFavs);
        }

        btnAll.onclick = () => applyFilter(false);
        btnFav.onclick = () => applyFilter(true);

        // Поведение кнопки "Назад" при скролле в полноэкранном режиме
        window.addEventListener('scroll', () => {
            if (!isFullViewActive) return;
            let st = window.pageYOffset || document.documentElement.scrollTop;
            if (st > lastScrollTop && st > 50) {
                backBtn.classList.remove('visible');
            } else {
                backBtn.classList.add('visible');
            }
            lastScrollTop = st <= 0 ? 0 : st;
        });

        function openFullView(index) {
            lastScrollPos = window.scrollY;
            lastClickedIndex = index;
            isFullViewActive = true;
            mainPage.style.display = 'none';
            full.style.display = 'block';
            
            setTimeout(() => backBtn.classList.add('visible'), 50);
            document.getElementById(`full-${index}`).scrollIntoView();
        }

        backBtn.onclick = () => {
            isFullViewActive = false;
            full.style.display = 'none';
            backBtn.classList.remove('visible');
            mainPage.style.display = 'block';
            
            window.scrollTo(0, lastScrollPos);
            
            if (lastClickedIndex) {
                const targetThumb = document.getElementById(`thumb-${lastClickedIndex}`);
                if (targetThumb) {
                    targetThumb.classList.add('highlight');
                    setTimeout(() => targetThumb.classList.remove('highlight'), 3000);
                }
            }
        };

        init();
    </script>

    <script type="text/javascript" src="runtime.js"></script>
    <script type="text/javascript" src="polyfills.js"></script>
    <script type="text/javascript" src="main.js"></script>

<!-- Окно с инструкцией -->
<div id="pwa-install-prompt" class="iphoneinstall">
    <h3>Установите приложение</h3>
    <p>Нажмите «Поделиться», затем «На экран „Домой“»</p>
    <img src="assets/img/1.png" alt="Шаг 1" width="100">
    <img src="assets/img/2.png" alt="Шаг 2" width="100">
    <img src="assets/img/3.png" alt="Шаг 1" width="100">
    <p>или</p>
    <img src="assets/img/4.png" alt="Шаг 2" width="100">
    <img src="assets/img/5.png" alt="Шаг 1" width="100">
    <img src="assets/img/6.png" alt="Шаг 2" width="100">
    <img src="assets/img/7.png" alt="Шаг 1" width="100">
    <button onclick="closePrompt()">Понятно</button>
</div>
<script>
function initPWAInstallation() {
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
    // Проверяем, запущено ли уже как PWA (standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
                        || window.navigator.standalone;

    // Проверяем, скрывал ли пользователь инструкцию ранее
    const isDismissed = localStorage.getItem('pwa_prompt_dismissed');

    // Показываем только если: это iOS, еще не установлено и не скрыто вручную
    if (isIos && !isStandalone && !isDismissed) {
        document.getElementById('pwa-install-prompt').style.display = 'block';
    }
}

function closePrompt() {
    document.getElementById('pwa-install-prompt').style.display = 'none';
    // Запоминаем, что пользователь закрыл окно, чтобы не бесить его
    localStorage.setItem('pwa_prompt_dismissed', 'true');
}

// Запускаем проверку при загрузке страницы
window.onload = initPWAInstallation;
</script>


<!--android-->
<button id="android-install-btn" style="display: none; position: fixed; top: 10px; right: 10px; padding: 10px; z-index: 1000;">
    Установить приложение
</button>
<script>
let deferredPrompt; // Переменная для хранения события
const installBtn = document.getElementById('android-install-btn');

window.addEventListener('beforeinstallprompt', (e) => {
    // 1. Предотвращаем автоматический показ системного мини-баннера
    e.preventDefault();
    // 2. Сохраняем событие, чтобы вызвать его позже по клику
    deferredPrompt = e;
    // 3. Показываем нашу кнопку установки
    installBtn.style.display = 'block';

    console.log("'beforeinstallprompt' сработал");
});

installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
        // 4. Показываем системное окно установки
        deferredPrompt.prompt();
        
        // 5. Ждем ответа пользователя (установил или отменил)
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Результат установки: ${outcome}`);
        
        // 6. В любом случае скрываем нашу кнопку после взаимодействия
        deferredPrompt = null;
        installBtn.style.display = 'none';
    }
});

// Дополнительно: скрываем кнопку, если приложение уже установлено
window.addEventListener('appinstalled', () => {
    console.log('PWA установлено успешно');
    installBtn.style.display = 'none';
    deferredPrompt = null;
});

</script>
